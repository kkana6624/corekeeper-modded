services:
  core-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: corekeeper-modded:local
    container_name: core-keeper-dedicated
    restart: unless-stopped
    stop_grace_period: 2m

    # メモリ制限（必要に応じて調整）
    # ※ `docker compose` (v2) では deploy.resources.limits が通常の compose 実行でも反映されます
    deploy:
      resources:
        limits:
          memory: 4g

    # Direct Connection を使う場合のみ有効化（UDP）
    # ports:
    #   - "${SERVER_PORT:-27015}:${SERVER_PORT:-27015}/udp"

    volumes:
      # ワールド/設定等の永続化
      - ./server-data:/home/steam/core-keeper-data

    env_file:
      - path: core.env
        required: false

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg