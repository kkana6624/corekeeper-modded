services:
  core-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: corekeeper-modded:local
    container_name: core-keeper-dedicated
    restart: unless-stopped
    stop_grace_period: 2m

    # メモリ制限（必要に応じて調整）
    # ※ `docker compose` (v2) では deploy.resources.limits が通常の compose 実行でも反映されます
    deploy:
      resources:
        limits:
          memory: 4g

    # Direct Connection を使う場合のみ有効化（UDP）
    # ports:
    #   - "${SERVER_PORT:-27015}:${SERVER_PORT:-27015}/udp"

    volumes:
      # ワールド/設定等の永続化
      - ./server-data:/home/steam/core-keeper-data

    env_file:
      - path: core.env
        required: false

  exporter:
    image: armsnyder/a2s-exporter
    container_name: core-keeper-exporter
    environment:
      - A2S_EXPORTER_QUERY_ADDRESS=core-keeper:27015
    ports:
      - "9101:9841"
    restart: unless-stopped
    depends_on:
      - core-keeper

  node-exporter:
    image: prom/node-exporter:latest
    container_name: core-keeper-node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro'
    ports:
      - "9100:9100"
