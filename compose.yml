services:
  core-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: corekeeper-modded:local
    container_name: core-keeper-dedicated
    restart: unless-stopped
    stop_grace_period: 2m

    # メモリ制限（必要に応じて調整）
    # ※ `docker compose` (v2) では deploy.resources.limits が通常の compose 実行でも反映されます
    deploy:
      resources:
        limits:
          memory: 4g

    # Direct Connection を使う場合のみ有効化（UDP）
    # ports:
    #   - "${SERVER_PORT:-27015}:${SERVER_PORT:-27015}/udp"

    volumes:
      # ワールド/設定等の永続化
      - ./server-data:/home/steam/core-keeper-data

    env_file:
      - path: core.env
        required: false

  discord-bot:
    build: ./bot
    container_name: core-keeper-bot
    restart: unless-stopped
    volumes:
      # Read logs/config to provide status
      - ./server-data:/home/steam/core-keeper-data:ro
      # Grant access to Docker Daemon for 'docker exec'
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: core.env
        required: true
